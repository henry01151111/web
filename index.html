<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>網站首頁｜專業形象</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Noto Sans TC", sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
            letter-spacing: 1px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .hero {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            padding: 100px 20px;
            text-align: center;
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            max-width: 700px;
            margin: auto;
        }

        .hero button {
            margin-top: 40px;
            padding: 14px 32px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #38bdf8;
            color: #0f172a;
            cursor: pointer;
        }

        .hero button:hover {
            background: #0ea5e9;
        }

        .section {
            padding: 80px 60px;
            max-width: 1200px;
            margin: auto;
        }

        .section h3 {
            font-size: 32px;
            text-align: center;
            margin-bottom: 40px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card h4 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        footer {
            background: #0f172a;
            color: #cbd5e1;
            text-align: center;
            padding: 30px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 10px;
            }

            .hero h2 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>MyWebsite</h1>
    <nav>
        <a href="#">首頁</a>
        <a href="#">關於我們</a>
        <a href="#">服務項目</a>
        <a href="#">聯絡我們</a>
    </nav>
</header>

<section class="hero">
    <h2>打造專業、可靠的數位形象</h2>
    <p>
        我們專注於高品質網站設計與數位解決方案，
        讓您的品牌在網路世界中脫穎而出。
    </p>
    <button>了解更多</button>
</section>

<section class="section">
    <h3>我們的優勢</h3>
    <div class="cards">
        <div class="card">
            <h4>專業設計</h4>
            <p>簡潔、大方且符合現代審美，提升品牌信任感。</p>
        </div>
        <div class="card">
            <h4>響應式版型</h4>
            <p>完美支援手機、平板與電腦，各裝置都好看。</p>
        </div>
        <div class="card">
            <h4>穩定效能</h4>
            <p>乾淨結構與最佳化程式碼，確保載入快速。</p>
        </div>
    </div>
</section>

<footer>
    © 2025 MyWebsite. All rights reserved.
</footer>

</body>
</html>
